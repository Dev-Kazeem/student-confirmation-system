<form method="get" class="card border-0 shadow-sm mb-3">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-3">
                <input type="text" name="q" value="{{ filters.q }}" class="form-control form-control-sm" placeholder="Search…">
            </div>
            <div class="col-md-2">
                <select name="status" class="form-select form-select-sm">
                    <option value="">All statuses</option>
                    {% for v, l in filters.statuses %}
                        <option value="{{ v }}" {% if filters.status == v %}selected{% endif %}>{{ l }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <select name="session" class="form-select form-select-sm">
                    <option value="">All sessions</option>
                    {% for s in filters.sessions %}
                        <option value="{{ s.pk }}" {% if filters.session == s.pk|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <select name="department" class="form-select form-select-sm">
                    <option value="">All departments</option>
                    {% for d in filters.departments %}
                        <option value="{{ d.pk }}" {% if filters.department == d.pk|stringformat:"s" %}selected{% endif %}>{{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-funnel me-1"></i> Filter</button>
            </div>
        </div>
    </div>
</form>
