{% extends "base.html" %}

{% block title %}Officer Dashboard — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 fw-bold mb-1">Officer Dashboard</h1>
            <p class="text-muted small mb-0">Welcome, {{ user.get_full_name|default:user.username }}</p>
        </div>
        <a href="{% url 'accounts:password_change' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-shield-lock me-1"></i> Change password
        </a>
    </div>

    <div class="alert alert-info small">
        <i class="bi bi-info-circle me-1"></i>
        Application review queue will appear here once Phase Six is complete.
    </div>
</div>
{% endblock %}
