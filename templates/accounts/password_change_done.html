{% extends "base.html" %}

{% block title %}Password Updated — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
            <h1 class="h4 fw-bold mt-3">Password Updated</h1>
            <p class="text-muted">Your password has been changed successfully.</p>
            <a href="{% url 'accounts:redirect_after_login' %}" class="btn btn-primary">
                <i class="bi bi-speedometer2 me-1"></i> Go to dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
